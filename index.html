<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f9ff">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <title>החידון של שיר</title>
  <style>
    :root {
      color-scheme: only light;
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --purple-50: #faf5ff;
      --purple-100: #f3e8ff;
      --purple-600: #9333ea;
      --green-50: #f0fdf4;
      --green-100: #dcfce7;
      --green-200: #bbf7d0;
      --green-500: #22c55e;
      --green-600: #16a34a;
      --green-700: #15803d;
      --red-50: #fef2f2;
      --red-500: #ef4444;
      --red-700: #b91c1c;
      --amber-50: #fffbeb;
      --amber-100: #fef3c7;
      --amber-200: #fde68a;
      --amber-300: #fcd34d;
      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --amber-700: #b45309;
      --yellow-100: #fef9c3;
      --yellow-300: #fde047;
      --yellow-400: #facc15;
      --yellow-700: #a16207;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --shadow: 0 22px 45px rgba(15, 23, 42, .14);
      --soft-shadow: 0 8px 20px rgba(15, 23, 42, .08);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      background: var(--slate-50);
      color: var(--slate-700);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, input:focus-visible {
      outline: 4px solid rgba(59, 130, 246, .28);
      outline-offset: 3px;
    }

    .screen {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .screen.start { background: #f0f9ff; }
    .screen.end { background: var(--green-50); }
    .screen.board { background: var(--amber-50); }

    .panel {
      width: min(100%, 512px);
      background: #fff;
      border-radius: 40px;
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .start .panel { border-bottom: 12px solid var(--blue-200); }
    .end .panel { border-bottom: 12px solid var(--green-200); }
    .board .panel { border-bottom: 12px solid var(--amber-300); }

    .hero-icon {
      font-size: 86px;
      line-height: 1;
      margin-bottom: 24px;
      filter: drop-shadow(0 7px 5px rgba(15, 23, 42, .14));
    }

    h1, h2, h3, p { margin-top: 0; }

    .title {
      margin-bottom: 24px;
      color: var(--blue-600);
      font-size: clamp(38px, 8vw, 52px);
      line-height: 1.08;
      font-weight: 900;
    }

    .subtitle {
      margin-bottom: 32px;
      color: var(--slate-600);
      font-size: clamp(18px, 4vw, 21px);
      line-height: 1.7;
      font-weight: 600;
    }

    .primary,
    .secondary,
    .plain-button {
      width: 100%;
      border-radius: 24px;
      transition: transform .13s ease, background .13s ease;
    }

    .primary:active,
    .secondary:active,
    .plain-button:active,
    .speech-button:active,
    .answer:active,
    .picture-button:active { transform: scale(.97); }

    .primary {
      padding: 21px 22px;
      background: var(--blue-500);
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 14px 24px rgba(59, 130, 246, .26);
    }

    .primary:hover { background: var(--blue-600); }

    .secondary {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--amber-100);
      color: var(--amber-700);
      font-size: 20px;
      font-weight: 800;
      box-shadow: var(--soft-shadow);
    }

    .secondary:hover { background: var(--amber-200); }

    .plain-button {
      margin-top: 12px;
      padding: 12px;
      background: transparent;
      color: var(--slate-500);
      font-weight: 800;
    }

    .game-screen {
      min-height: 100vh;
      background: var(--slate-50);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      width: min(100%, 672px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 4px 0 24px;
    }

    .score-pill,
    .question-pill {
      background: #fff;
      border-radius: 17px;
      padding: 9px 16px;
      box-shadow: 0 2px 7px rgba(15, 23, 42, .06);
      font-weight: 900;
      white-space: nowrap;
    }

    .score-pill {
      border: 2px solid var(--yellow-100);
      color: var(--blue-600);
      font-size: 24px;
    }

    .question-pill {
      border: 1px solid var(--slate-100);
      color: var(--slate-500);
      font-size: 18px;
    }

    .game-wrap {
      width: min(100%, 672px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .word-card {
      position: relative;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      border-radius: 40px;
      border-bottom: 8px solid var(--slate-100);
      box-shadow: 0 16px 30px rgba(15, 23, 42, .11);
      text-align: center;
    }

    .image-area {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .picture-button {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 4px dashed var(--blue-200);
      background: var(--blue-50);
      color: var(--blue-500);
      font-weight: 900;
      transition: transform .13s ease, background .13s ease;
    }

    .picture-button:hover { background: var(--blue-100); }

    .question-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 3px solid var(--blue-500);
      border-radius: 50%;
      font-size: 23px;
      line-height: 1;
    }

    .emoji-picture {
      font-size: clamp(74px, 16vw, 100px);
      line-height: 1;
      filter: drop-shadow(0 6px 4px rgba(15, 23, 42, .16));
      animation: pop .25s ease-out;
    }

    .point-value {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 6px 12px;
      border: 2px solid var(--yellow-300);
      border-radius: 999px;
      background: var(--yellow-100);
      color: var(--yellow-700);
      font-size: 14px;
      font-weight: 900;
      transition: all .2s ease;
    }

    .point-value.revealed {
      border-color: var(--slate-200);
      background: var(--slate-100);
      color: var(--slate-500);
    }

    .english-word {
      width: 100%;
      margin-bottom: 22px;
      color: var(--blue-600);
      font-size: clamp(48px, 12vw, 72px);
      line-height: 1;
      font-weight: 900;
      overflow-wrap: anywhere;
      direction: ltr;
    }

    .speech-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .speech-button {
      min-height: 64px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 900;
      transition: transform .13s ease, background .13s ease;
    }

    .speech-button.say {
      border: 2px solid var(--blue-100);
      background: var(--blue-50);
      color: var(--blue-600);
    }

    .speech-button.say:hover { background: var(--blue-100); }

    .speech-button.spell {
      border: 2px solid var(--purple-100);
      background: var(--purple-50);
      color: var(--purple-600);
    }

    .speech-button.spell:hover { background: var(--purple-100); }

    .speech-icon { font-size: 24px; }

    .audio-status {
      min-height: 24px;
      margin: 10px 0 -2px;
      color: var(--slate-500);
      font-size: 14px;
      font-weight: 700;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-bottom: 24px;
    }

    .answer {
      min-height: 88px;
      padding: 17px;
      border: 4px solid var(--slate-200);
      border-radius: 24px;
      background: #fff;
      color: var(--slate-700);
      font-size: clamp(22px, 5vw, 27px);
      font-weight: 900;
      box-shadow: 0 3px 8px rgba(15, 23, 42, .03);
      transition: transform .13s ease, border .13s ease, background .13s ease, opacity .13s ease;
    }

    .answer:hover:not(:disabled) { border-color: #93c5fd; }

    .answer.correct {
      border-color: var(--green-500);
      background: var(--green-100);
      color: var(--green-700);
      transform: scale(1.02);
    }

    .answer.wrong {
      border-color: var(--red-500);
      background: var(--red-50);
      color: var(--red-700);
    }

    .answer.dim { opacity: .46; }

    .feedback {
      min-height: 30px;
      margin: -10px 0 8px;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    .feedback.wrong { color: var(--red-700); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(8px);
      animation: fade .18s ease-out;
    }

    .success-card {
      width: min(100%, 448px);
      padding: 38px;
      border: 8px solid var(--yellow-400);
      border-radius: 40px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
      animation: pop .24s ease-out;
    }

    .sparkle { font-size: 76px; margin-bottom: 12px; }

    .success-card h2 {
      margin-bottom: 18px;
      color: var(--blue-600);
      font-size: clamp(35px, 8vw, 48px);
      line-height: 1.15;
      font-weight: 900;
    }

    .points-earned {
      display: inline-block;
      margin-bottom: 28px;
      padding: 9px 24px;
      border: 2px solid var(--yellow-300);
      border-radius: 999px;
      background: var(--yellow-100);
      color: var(--yellow-700);
      font-size: 23px;
      font-weight: 900;
    }

    .continue {
      background: var(--green-500);
      box-shadow: 0 12px 22px rgba(34, 197, 94, .22);
    }

    .continue:hover { background: var(--green-600); }

    .end-title { color: var(--green-600); }
    .board-title { color: var(--amber-600); }

    .score-box {
      margin-bottom: 24px;
      padding: 26px;
      border: 2px solid var(--green-100);
      border-radius: 24px;
      background: var(--green-50);
      color: var(--green-700);
      font-size: 19px;
      font-weight: 900;
    }

    .final-score {
      display: block;
      margin-top: 8px;
      color: var(--green-600);
      font-size: 66px;
      line-height: 1;
    }

    .high-score {
      margin-bottom: 28px;
      padding: 22px;
      border: 2px solid var(--amber-200);
      border-radius: 24px;
      background: var(--amber-50);
    }

    .high-score h3 {
      margin-bottom: 8px;
      color: var(--amber-600);
      font-size: 26px;
      font-weight: 900;
    }

    .high-score p { color: var(--amber-700); font-weight: 700; }

    .name-input {
      width: 100%;
      margin-bottom: 14px;
      padding: 14px;
      border: 2px solid var(--amber-300);
      border-radius: 13px;
      background: #fff;
      color: var(--slate-700);
      text-align: center;
      font-size: 24px;
      font-weight: 800;
    }

    .save-score {
      padding: 16px;
      border-radius: 13px;
      background: var(--amber-500);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
    }

    .save-score:hover { background: var(--amber-600); }

    .leader-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }

    .leader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--slate-100);
      border-radius: 18px;
      background: var(--slate-50);
    }

    .leader-row.first {
      border: 2px solid var(--amber-300);
      background: var(--amber-100);
      box-shadow: var(--soft-shadow);
      transform: scale(1.025);
    }

    .rank-name { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .rank { color: var(--slate-400); font-size: 23px; font-weight: 900; }
    .first .rank { color: var(--amber-500); }
    .leader-name { overflow: hidden; color: var(--slate-700); font-size: 22px; font-weight: 900; text-overflow: ellipsis; }
    .leader-score { color: var(--blue-600); font-size: 28px; font-weight: 900; }
    .empty-board { margin: 0 0 34px; color: var(--slate-500); font-size: 18px; font-weight: 700; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.86); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 560px) {
      .screen { padding: 16px; }
      .panel { padding: 30px 22px; border-radius: 32px; }
      .game-screen { padding: 12px; }
      .topbar { margin-bottom: 14px; }
      .score-pill { font-size: 20px; padding: 8px 12px; }
      .question-pill { font-size: 15px; padding: 8px 11px; }
      .word-card { padding: 20px 14px; border-radius: 30px; }
      .image-area { min-height: 116px; }
      .picture-button { width: 108px; height: 108px; }
      .point-value { top: 17px; left: 17px; }
      .speech-button { min-height: 58px; font-size: 17px; }
      .answers { grid-template-columns: 1fr; gap: 10px; }
      .answer { min-height: 66px; }
      .success-card { padding: 30px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

      { w: "Eye", t: "עין", e: "👁️", h: "רואים איתה" },
      { w: "Ear", t: "אוזן", e: "👂", h: "שומעים איתה" },
      { w: "Mouth", t: "פה", e: "👄", h: "אוכלים ומדברים איתו" },
      { w: "Hat", t: "כובע", e: "🎩", h: "שמים על הראש" },
      { w: "Shirt", t: "חולצה", e: "👕", h: "לובשים על הגוף" },
      { w: "Pants", t: "מכנסיים", e: "👖", h: "לובשים על הרגליים" },
      { w: "Shoe", t: "נעל", e: "👞", h: "נועלים על כף הרגל" }
    ];

    const ENCOURAGEMENTS = [
      "כל הכבוד, את אלופה!",
      "מדהים! פשוט תותחית!",
      "יופי של עבודה! לומדת נהדר!",
      "איזו אלופה! בדרך הנכונה!",
      "מעולה! ממש מוכשרת!",
      "שיחקת אותה! פשוט נהדרת!"
    ];

    const QUESTIONS_PER_GAME = 10;
    const app = document.getElementById("app");

    const state = {
      screen: "start",
      gameWords: [],
      index: 0,
      score: 0,
      options: [],
      selected: null,
      correct: null,
      revealed: false,
      pointsEarned: 0,
      encouragement: "",
      playerName: "שיר",
      leaderboard: [],
      isHighScore: false,
      timer: null,
      audioMessage: ""
    };

    const escapeHtml = value => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    }

    function preferredVoice(langPrefix) {
      const voices = window.speechSynthesis?.getVoices?.() || [];
      return voices.find(voice => voice.lang.toLowerCase().startsWith(langPrefix)) ||
        voices.find(voice => voice.lang.toLowerCase().startsWith("en"));
    }

    function speakEnglish(text, mode) {
      stopSpeech();
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
        state.audioMessage = "ההקראה אינה זמינה בדפדפן הזה";
        render();
        return;
      }

      const spoken = mode === "spell"
        ? [...text.toUpperCase()].map(char => char === " " ? "space" : char).join(", ")
        : text;
      const utterance = new SpeechSynthesisUtterance(spoken);
      utterance.lang = "en-US";
      utterance.rate = mode === "spell" ? .5 : .85;
      utterance.pitch = 1.1;
      const voice = preferredVoice("en-us") || preferredVoice("en-gb");
      if (voice) utterance.voice = voice;

      state.audioMessage = mode === "spell" ? "מאייתת את המילה…" : "משמיעה את המילה…";
      render();
      utterance.onend = () => {
        state.audioMessage = "";
        const status = document.getElementById("audio-status");
        if (status) status.textContent = "";
      };
      utterance.onerror = () => {
        state.audioMessage = "לא הצלחנו להשמיע. נסי שוב.";
        const status = document.getElementById("audio-status");
        if (status) status.textContent = state.audioMessage;
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakHebrew(text) {
      stopSpeech();
      if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "he-IL";
      utterance.rate = .95;
      utterance.pitch = 1.12;
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(item => item.lang.toLowerCase().startsWith("he"));
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }

    function currentItem() {
      return state.gameWords[state.index];
    }

    function setupQuestion(item) {
      const distractors = shuffle(WORDS.filter(word => word.t !== item.t)).slice(0, 3).map(word => word.t);
      state.options = shuffle([...distractors, item.t]);
      state.selected = null;
      state.correct = null;
      state.revealed = false;
      state.pointsEarned = 0;
      state.encouragement = "";
      state.audioMessage = "";
    }

    function startNewGame() {
      clearTimeout(state.timer);
      stopSpeech();
      state.gameWords = shuffle(WORDS).slice(0, QUESTIONS_PER_GAME);
      state.index = 0;
      state.score = 0;
      state.screen = "play";
      setupQuestion(state.gameWords[0]);
      render();
    }

    function finishGame() {
      state.screen = "end";
      state.isHighScore = state.score > 0 && (
        state.leaderboard.length < 5 ||
        state.score > (state.leaderboard[state.leaderboard.length - 1]?.score || 0)
      );
      render();
    }

    function nextQuestion() {
      clearTimeout(state.timer);
      stopSpeech();
      if (state.index < state.gameWords.length - 1) {
        state.index += 1;
        setupQuestion(currentItem());
        state.screen = "play";
        render();
      } else {
        finishGame();
      }
    }

    function chooseAnswer(choice) {
      if (state.selected !== null || state.screen === "success") return;
      const right = choice === currentItem().t;
      state.selected = choice;
      state.correct = right;

      if (right) {
        state.pointsEarned = state.revealed ? 10 : 20;
        state.score += state.pointsEarned;
        state.encouragement = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
        state.screen = "success";
        render();
        speakHebrew(state.encouragement);
        state.timer = setTimeout(nextQuestion, 3500);
      } else {
        render();
        state.timer = setTimeout(nextQuestion, 1500);
      }
    }

    function saveScore() {
      const input = document.getElementById("player-name");
      const name = input?.value.trim() || "שחקן לא ידוע";
      state.playerName = name;
      state.leaderboard = [...state.leaderboard, { name, score: state.score }]
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);
      state.isHighScore = false;
      state.screen = "leaderboard";
      render();
    }

    function renderStart() {
      app.innerHTML = `
        <main class="screen start">
          <section class="panel" aria-labelledby="start-title">
            <div class="hero-icon" aria-hidden="true">🎯</div>
            <h1 class="title" id="start-title">החידון של שיר</h1>
            <p class="subtitle">משחק קצר של ${QUESTIONS_PER_GAME} שאלות!<br>עני נכון מבלי לראות תמונה — וקבלי כפול נקודות!</p>
            <button class="primary" id="start-game">בואי נתחיל! 🚀</button>
            ${state.leaderboard.length ? '<button class="secondary" id="show-board">🏅 טבלת האלופים</button>' : ''}
          </section>
        </main>`;
      document.getElementById("start-game").addEventListener("click", startNewGame);
      document.getElementById("show-board")?.addEventListener("click", () => {
        state.screen = "leaderboard";
        render();
      });
    }

    function answerClass(option) {
      if (state.selected === null) return "";
      if (option === currentItem().t) return "correct";
      if (option === state.selected) return "wrong";
      return "dim";
    }

    function renderGame() {
      const item = currentItem();
      app.innerHTML = `
        <main class="game-screen">
          <header class="topbar">
            <div class="score-pill" aria-label="ניקוד"><span aria-hidden="true">⭐</span> ${state.score}</div>
            <div class="question-pill">שאלה ${state.index + 1} מתוך ${QUESTIONS_PER_GAME}</div>
          </header>

          <section class="game-wrap" aria-label="שאלת אוצר מילים">
            <article class="word-card">
              <div class="image-area">
                ${state.revealed
                  ? `<div class="emoji-picture" role="img" aria-label="רמז בתמונה">${item.e}</div>`
                  : `<button class="picture-button" id="show-picture" aria-label="הצג תמונה">
                      <span class="question-mark" aria-hidden="true">?</span>
                      <span>הצג תמונה</span>
                    </button>`}
              </div>
              <div class="point-value ${state.revealed ? "revealed" : ""}">🎯 ${state.revealed ? 10 : 20} נק׳</div>
              <h1 class="english-word" lang="en">${escapeHtml(item.w)}</h1>
              <div class="speech-row">
                <button class="speech-button say" id="say-word" aria-label="השמעת המילה ${escapeHtml(item.w)}">
                  <span class="speech-icon" aria-hidden="true">🔊</span><span>השמעה</span>
                </button>
                <button class="speech-button spell" id="spell-word" aria-label="איות המילה ${escapeHtml(item.w)}">
                  <span class="speech-icon" aria-hidden="true">A⌄</span><span>איות</span>
                </button>
              </div>
              <p class="audio-status" id="audio-status" aria-live="polite">${escapeHtml(state.audioMessage)}</p>
            </article>

            <div class="answers" aria-label="אפשרויות תשובה">
              ${state.options.map(option => `
                <button class="answer ${answerClass(option)}" data-answer="${escapeHtml(option)}" ${state.selected !== null ? "disabled" : ""}>
                  ${escapeHtml(option)}
                </button>`).join("")}
            </div>
            <p class="feedback ${state.correct === false ? "wrong" : ""}" role="status">
              ${state.correct === false ? `לא נורא — התשובה היא ${escapeHtml(item.t)}` : ""}
            </p>
          </section>

          ${state.screen === "success" ? `
            <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="success-title">
              <section class="success-card">
                <div class="sparkle" aria-hidden="true">✨</div>
                <h2 id="success-title">${escapeHtml(state.encouragement)}</h2>
                <div class="points-earned">+${state.pointsEarned} נקודות!</div>
                <button class="primary continue" id="continue-now">המשך מיד ⏩</button>
              </section>
            </div>` : ""}
        </main>`;

      document.getElementById("show-picture")?.addEventListener("click", () => {
        state.revealed = true;
        render();
      });
      document.getElementById("say-word").addEventListener("click", () => speakEnglish(item.w, "say"));
      document.getElementById("spell-word").addEventListener("click", () => speakEnglish(item.w, "spell"));
      document.querySelectorAll("[data-answer]").forEach(button => {
        button.addEventListener("click", () => chooseAnswer(button.dataset.answer));
      });
      document.getElementById("continue-now")?.addEventListener("click", nextQuestion);
    }

    function renderEnd() {
      app.innerHTML = `
        <main class="screen end">
          <section class="panel" aria-labelledby="end-title">
            <div class="hero-icon" aria-hidden="true">🏆</div>
            <h1 class="title end-title" id="end-title">סיימת את המשחק!</h1>
            <div class="score-box">הציון הסופי שלך:<strong class="final-score">${state.score}</strong></div>
            ${state.isHighScore ? `
              <section class="high-score" aria-labelledby="high-score-title">
                <h3 id="high-score-title">🎉 שיא חדש! 🎉</h3>
                <p>נכנסת לטבלת חמשת הגדולים!</p>
                <label class="sr-only" for="player-name">הכניסי את שמך</label>
                <input class="name-input" id="player-name" type="text" value="${escapeHtml(state.playerName)}" maxlength="20" placeholder="הכניסי את שמך">
                <button class="primary save-score" id="save-score">שמרי בטבלת האלופים!</button>
              </section>` : `
              <button class="primary" id="view-board">🏅 צפייה בטבלת האלופים</button>`}
          </section>
        </main>`;
      document.getElementById("save-score")?.addEventListener("click", saveScore);
      document.getElementById("view-board")?.addEventListener("click", () => {
        state.screen = "leaderboard";
        render();
      });
    }

    function renderLeaderboard() {
      app.innerHTML = `
        <main class="screen board">
          <section class="panel" aria-labelledby="board-title">
            <div class="hero-icon" aria-hidden="true">🏅</div>
            <h1 class="title board-title" id="board-title">טבלת האלופים 🏆</h1>
            ${state.leaderboard.length ? `
              <div class="leader-list">
                ${state.leaderboard.map((entry, index) => `
                  <div class="leader-row ${index === 0 ? "first" : ""}">
                    <div class="rank-name"><span class="rank">#${index + 1}</span><span class="leader-name">${escapeHtml(entry.name)}</span></div>
                    <span class="leader-score">${entry.score}</span>
                  </div>`).join("")}
              </div>` : `<p class="empty-board">עדיין אין שיאים. שחקי והיי הראשונה!</p>`}
            <button class="primary" id="new-game">↻ משחק חדש</button>
            <button class="plain-button" id="back-home">חזרה למסך הראשי</button>
          </section>
        </main>`;
      document.getElementById("new-game").addEventListener("click", startNewGame);
      document.getElementById("back-home").addEventListener("click", () => {
        state.screen = "start";
        render();
      });
    }

    function render() {
      if (state.screen === "start") return renderStart();
      if (state.screen === "end") return renderEnd();
      if (state.screen === "leaderboard") return renderLeaderboard();
      return renderGame();
    }

    window.speechSynthesis?.getVoices?.();
    render();
  </script>
</body>
</html>
